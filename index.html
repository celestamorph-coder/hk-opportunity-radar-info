<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>香港活动与机会雷达</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:17px/1.8 system-ui,sans-serif;color:#17212b}h1{font-size:28px}h2{font-size:21px;margin-top:32px}a{color:#1258a8}</style><main><h1>香港活动与机会雷达</h1><p>这是供维护者个人使用的香港公开活动信息整理工具。它读取 HKWeb3/Luma 与 HKSI 的公开活动页面，在维护者的 Mac 上保存活动事实、出处及核实时间，依据规则生成中文日报。</p><p>邮件功能使用维护者授权的 Gmail 账号，将日报发送至维护者在本机配置的收件地址。后台任务目标为每天香港时间08:00运行；电脑睡眠、离线或授权失效时可能延迟。</p><p>本工具不会自动报名或付款。公开活动的费用、资格和时间以主办方正式页面为准；缺失资料保留未知。</p><p><a href="privacy.html">隐私说明</a></p></main></html>
